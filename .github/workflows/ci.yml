name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: |
          go -C shared build ./...
          go -C worker build ./...
          go -C telemetry-server build ./...

      - name: Vet
        run: |
          go -C shared vet ./...
          go -C worker vet ./...
          go -C telemetry-server vet ./...

      - name: Test
        run: |
          go -C shared test ./...
          go -C worker test ./...
          go -C telemetry-server test ./...

      - name: Architecture lint (worker)
        run: make -C worker lint-arch
