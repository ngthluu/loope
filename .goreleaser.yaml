# GoReleaser configuration for loope.
# Local dry run:        goreleaser release --snapshot --clean
# Real release:         git tag v0.2.1 && git push origin v0.2.1        (CI does the rest)
# Release candidate:    git tag v0.2.2-rc.1 && git push origin v0.2.2-rc.1
#
# Both flows run the same pipeline; the -rc.N suffix is what separates them:
#   - GitHub release:  prerelease: auto marks rc tags as prereleases, so
#     /releases/latest (which install.sh uses) never resolves to an rc.
#   - Docker image:    rc versions get their versioned GHCR tags, but the
#     :latest manifest is skipped (skip_push: auto below).
version: 2

project_name: loope

before:
  hooks:
    - go -C shared mod tidy
    - go -C worker mod tidy
    - go -C telemetry-server mod tidy

builds:
  - id: loope
    dir: worker
    main: .
    binary: loope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: telemetry-server
    dir: telemetry-server
    main: .
    binary: loope-telemetry-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: loope
    ids: [loope]
    # Predictable lowercase names so install.sh can construct the URL directly:
    #   loope_darwin_arm64.tar.gz, loope_linux_amd64.tar.gz, ...
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - worker/loope.json.example
      - worker/persona.example.md

# The telemetry server ships as a container image, not an archive: one image
# per arch (goreleaser drops the prebuilt binary into the build context, so
# Dockerfile.release only packages), stitched into multi-arch manifests
# below. Published to GHCR with the workflow's GITHUB_TOKEN.
dockers:
  - id: telemetry-server-amd64
    ids: [telemetry-server]
    goos: linux
    goarch: amd64
    dockerfile: telemetry-server/Dockerfile.release
    use: buildx
    image_templates:
      - ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}-amd64
    build_flag_templates:
      - --platform=linux/amd64
  - id: telemetry-server-arm64
    ids: [telemetry-server]
    goos: linux
    goarch: arm64
    dockerfile: telemetry-server/Dockerfile.release
    use: buildx
    image_templates:
      - ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}-arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}
    image_templates:
      - ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}-amd64
      - ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}-arm64
  - name_template: ghcr.io/ngthluu/loope-telemetry-server:latest
    # auto = don't move :latest for prerelease (v*-rc.N) tags.
    skip_push: auto
    image_templates:
      - ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}-amd64
      - ghcr.io/ngthluu/loope-telemetry-server:{{ .Version }}-arm64

checksum:
  name_template: checksums.txt

changelog:
  # NOTE: disable: true also blocks the --release-notes flag (GoReleaser
  # renders an empty body regardless), so this must not be re-enabled.
  # These filters are the fallback for rc tags, which have no
  # docs/release-notes/<tag>.md and so release without --release-notes.
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
