# GoReleaser configuration for loope.
# Local dry run:  goreleaser release --snapshot --clean
# Real release:   git tag v0.1.0 && git push origin v0.1.0  (CI does the rest)
version: 2

project_name: loope

before:
  hooks:
    - go -C shared mod tidy
    - go -C worker mod tidy
    - go -C telemetry-server mod tidy

builds:
  - id: loope
    dir: worker
    main: .
    binary: loope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: telemetry-server
    dir: telemetry-server
    main: .
    binary: loope-telemetry-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: loope
    ids: [loope]
    # Predictable lowercase names so install.sh can construct the URL directly:
    #   loope_darwin_arm64.tar.gz, loope_linux_amd64.tar.gz, ...
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - worker/loope.json.example
      - worker/persona.example.md
  - id: telemetry-server
    ids: [telemetry-server]
    name_template: "loope-telemetry-server_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: false
  prerelease: auto
